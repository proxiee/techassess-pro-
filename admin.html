<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechAssess Pro — Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: var(--bg-primary); min-height: 100vh; }
    .admin-wrapper { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }

    .admin-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 36px; padding-bottom: 24px; border-bottom: 1px solid var(--border);
    }
    .admin-header h1 { font-size: 1.8rem; font-weight: 800; }
    .admin-header h1 span { color: var(--accent-light); }
    .admin-header .subtitle { color: var(--text-secondary); font-size: 0.9rem; margin-top: 4px; }

    .admin-stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 36px; }
    .admin-stat-card { padding: 20px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); }
    .admin-stat-card .stat-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .admin-stat-card .stat-value { font-size: 2rem; font-weight: 800; margin-top: 6px; }
    .admin-stat-card .stat-value.accent { color: var(--accent-light); }
    .admin-stat-card .stat-value.success { color: var(--success); }
    .admin-stat-card .stat-value.warning { color: var(--warning); }

    .exam-list { display: flex; flex-direction: column; gap: 16px; }
    .exam-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; transition: var(--transition); }
    .exam-card:hover { border-color: var(--accent); background: var(--bg-card-hover); }

    .exam-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .candidate-info h3 { font-size: 1.1rem; font-weight: 700; }
    .candidate-info .candidate-meta { display: flex; gap: 16px; margin-top: 4px; font-size: 0.8rem; color: var(--text-muted); }
    .exam-badge { padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; }
    .badge-good { background: var(--success-bg); color: var(--success); }
    .badge-warn { background: var(--warning-bg); color: var(--warning); }
    .badge-bad { background: var(--danger-bg); color: var(--danger); }

    .exam-card-scores { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 16px; }
    .score-chip { padding: 10px 12px; background: rgba(255,255,255,0.03); border-radius: var(--radius-sm); border: 1px solid var(--border); }
    .score-chip .chip-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
    .score-chip .chip-value { font-size: 1.1rem; font-weight: 700; margin-top: 2px; }

    .exam-card-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .action-btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px;
      border-radius: var(--radius-sm); font-family: var(--font-sans); font-size: 0.85rem; font-weight: 600;
      cursor: pointer; transition: var(--transition); border: 1px solid var(--border); background: var(--bg-card); color: var(--text-primary);
    }
    .action-btn:hover { background: var(--bg-card-hover); border-color: var(--accent); }
    .action-btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
    .action-btn.primary:hover { background: var(--accent-light); }
    .action-btn.danger { color: var(--danger); border-color: rgba(239,68,68,0.3); }
    .action-btn.danger:hover { background: var(--danger-bg); }

    .detail-modal {
      position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.8); backdrop-filter: blur(12px);
      display: none; align-items: flex-start; justify-content: center; padding: 40px 20px; overflow-y: auto;
    }
    .detail-modal.active { display: flex; }
    .detail-panel { max-width: 900px; width: 100%; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 36px; }
    .detail-panel h2 { font-size: 1.4rem; margin-bottom: 20px; }
    .detail-close { float: right; background: none; border: none; color: var(--text-secondary); font-size: 1.5rem; cursor: pointer; padding: 4px 10px; }
    .detail-close:hover { color: var(--text-primary); }

    .detail-section { margin-bottom: 28px; }
    .detail-section h3 { font-size: 1rem; font-weight: 700; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }

    .video-player { width: 100%; max-height: 400px; border-radius: var(--radius-md); background: #000; border: 1px solid var(--border); }

    .answer-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .answer-table th, .answer-table td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); }
    .answer-table th { color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px; }
    .answer-table .correct { color: var(--success); }
    .answer-table .incorrect { color: var(--danger); }

    .code-review {
      background: #1a1a2e; padding: 16px; border-radius: var(--radius-md);
      font-family: var(--font-mono); font-size: 0.85rem; color: #e0e0ff;
      white-space: pre-wrap; overflow-x: auto; border: 1px solid var(--border); max-height: 300px; overflow-y: auto; margin-top: 8px;
    }

    .empty-state { text-align: center; padding: 80px 20px; color: var(--text-muted); }
    .empty-state .empty-icon { font-size: 4rem; margin-bottom: 16px; }
    .empty-state h2 { font-size: 1.3rem; color: var(--text-secondary); margin-bottom: 8px; }

    .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--accent-light); text-decoration: none; font-size: 0.9rem; }
    .back-link:hover { text-decoration: underline; }
    .refresh-btn { margin-left: 12px; }

    .loading { text-align: center; padding: 40px; color: var(--text-muted); }

    @media (max-width: 768px) {
      .admin-stats-bar { grid-template-columns: repeat(2, 1fr); }
      .exam-card-scores { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="admin-wrapper">
    <div class="admin-header">
      <div>
        <h1>📊 Admin <span>Dashboard</span></h1>
        <p class="subtitle">Review candidate exam sessions, recordings, and proctoring logs</p>
      </div>
      <div>
        <button class="action-btn primary refresh-btn" onclick="loadDashboard()">🔄 Refresh</button>
      </div>
    </div>

    <div class="admin-stats-bar">
      <div class="admin-stat-card"><div class="stat-label">Total Exams</div><div class="stat-value accent" id="stat-total">0</div></div>
      <div class="admin-stat-card"><div class="stat-label">Avg MCQ Score</div><div class="stat-value success" id="stat-avg">0%</div></div>
      <div class="admin-stat-card"><div class="stat-label">Total Warnings</div><div class="stat-value warning" id="stat-warnings">0</div></div>
      <div class="admin-stat-card"><div class="stat-label">Recordings</div><div class="stat-value accent" id="stat-recordings">0</div></div>
    </div>

    <div class="exam-list" id="exam-list">
      <div class="loading" id="loading-state">Loading exam data from server...</div>
      <div class="empty-state" id="empty-state" style="display:none;">
        <div class="empty-icon">📋</div>
        <h2>No exam submissions yet</h2>
        <p>Exam data and recordings will appear here once candidates submit their assessments.</p>
      </div>
    </div>
  </div>

  <div class="detail-modal" id="detail-modal">
    <div class="detail-panel" id="detail-panel"></div>
  </div>

  <script>
    (function () {
      "use strict";

      function formatDate(iso) {
        const d = new Date(iso);
        return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) +
          " " + d.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      // ── Load from server API ───────────────────────────
      window.loadDashboard = async function () {
        const list = document.getElementById("exam-list");
        const loading = document.getElementById("loading-state");
        const empty = document.getElementById("empty-state");

        loading.style.display = "block";
        empty.style.display = "none";

        try {
          const res = await fetch("/api/exams");
          const exams = await res.json();

          loading.style.display = "none";

          // Update stats
          document.getElementById("stat-total").textContent = exams.length;
          if (exams.length > 0) {
            const avgScore = Math.round(exams.reduce((s, e) => s + (e.mcqScore / e.mcqTotal) * 100, 0) / exams.length);
            document.getElementById("stat-avg").textContent = avgScore + "%";
            document.getElementById("stat-warnings").textContent = exams.reduce((s, e) => s + e.warnings.length, 0);
            document.getElementById("stat-recordings").textContent = exams.filter(e => e.hasRecording).length;
          } else {
            document.getElementById("stat-avg").textContent = "0%";
            document.getElementById("stat-warnings").textContent = "0";
            document.getElementById("stat-recordings").textContent = "0";
          }

          if (exams.length === 0) {
            empty.style.display = "block";
            return;
          }

          list.innerHTML = exams.map(exam => {
            const scorePercent = Math.round((exam.mcqScore / exam.mcqTotal) * 100);
            const badgeClass = exam.warnings.length === 0 ? "badge-good" : exam.warnings.length <= 3 ? "badge-warn" : "badge-bad";
            const badgeText = exam.warnings.length === 0 ? "Clean" : `${exam.warnings.length} Warnings`;

            return `
              <div class="exam-card">
                <div class="exam-card-header">
                  <div class="candidate-info">
                    <h3>${escapeHtml(exam.candidate.name)}</h3>
                    <div class="candidate-meta">
                      <span>📧 ${escapeHtml(exam.candidate.email)}</span>
                      <span>🆔 ${escapeHtml(exam.candidate.id)}</span>
                      <span>📅 ${formatDate(exam.startTime)}</span>
                    </div>
                  </div>
                  <span class="exam-badge ${badgeClass}">${badgeText}</span>
                </div>
                <div class="exam-card-scores">
                  <div class="score-chip"><div class="chip-label">MCQ Score</div><div class="chip-value" style="color:${scorePercent >= 70 ? "var(--success)" : scorePercent >= 50 ? "var(--warning)" : "var(--danger)"}">${exam.mcqScore}/${exam.mcqTotal} (${scorePercent}%)</div></div>
                  <div class="score-chip"><div class="chip-label">Coding</div><div class="chip-value">${exam.codingSubmitted}/${exam.codingTotal}</div></div>
                  <div class="score-chip"><div class="chip-label">Duration</div><div class="chip-value">${exam.duration}</div></div>
                  <div class="score-chip"><div class="chip-label">Warnings</div><div class="chip-value" style="color:${exam.warnings.length > 0 ? "var(--danger)" : "var(--success)"}">${exam.warnings.length}</div></div>
                  <div class="score-chip"><div class="chip-label">Recording</div><div class="chip-value">${exam.hasRecording ? "✅ Yes" : "❌ No"}</div></div>
                </div>
                <div class="exam-card-actions">
                  <button class="action-btn primary" onclick="viewDetail('${escapeHtml(exam.id)}')">📋 View Details</button>
                  ${exam.recordingFile ? `<button class="action-btn" onclick="watchRecording('${escapeHtml(exam.recordingFile)}')">📹 Watch Recording</button>` : ""}
                  ${exam.recordingFile ? `<button class="action-btn" onclick="downloadRecording('${escapeHtml(exam.recordingFile)}')">⬇️ Download Recording</button>` : ""}
                  <button class="action-btn danger" onclick="removeExam('${escapeHtml(exam.id)}')">🗑️ Delete</button>
                </div>
              </div>`;
          }).join("");

        } catch (err) {
          loading.textContent = "Failed to load exam data. Is the server running?";
          console.error("Dashboard load error:", err);
        }
      };

      // ── View Detail ──────────────────────────────────
      window.viewDetail = async function (id) {
        try {
          const res = await fetch(`/api/exams/${encodeURIComponent(id)}`);
          const exam = await res.json();
          showDetailModal(exam);
        } catch (err) {
          alert("Failed to load exam details.");
        }
      };

      function showDetailModal(exam) {
        const panel = document.getElementById("detail-panel");
        const scorePercent = Math.round((exam.mcqScore / exam.mcqTotal) * 100);

        let answerRows = "";
        if (exam.answers) {
          Object.entries(exam.answers).forEach(([key, val]) => {
            if (typeof val === "string") {
              answerRows += `<tr><td>${escapeHtml(key)}</td><td colspan="2"><div class="code-review">${escapeHtml(val)}</div></td></tr>`;
            } else {
              answerRows += `<tr><td>${escapeHtml(key)}</td><td class="${val.isCorrect ? "correct" : "incorrect"}">${escapeHtml(val.selectedText)} ${val.isCorrect ? "✅" : "❌"}</td></tr>`;
            }
          });
        }

        let warningLog = "";
        if (exam.warnings && exam.warnings.length > 0) {
          warningLog = exam.warnings.map(w =>
            `<div class="log-entry"><span class="log-time">${formatDate(w.time)}</span><span class="log-type warning">Warning</span><span>${escapeHtml(w.message)}</span></div>`
          ).join("");
        } else {
          warningLog = '<p style="color:var(--success);">✅ No violations detected.</p>';
        }

        panel.innerHTML = `
          <button class="detail-close" onclick="closeDetail()">✕</button>
          <h2>${escapeHtml(exam.candidate.name)} — Exam Details</h2>

          <div class="detail-section">
            <h3>Candidate Information</h3>
            <table class="answer-table">
              <tr><td style="color:var(--text-muted)">Name</td><td>${escapeHtml(exam.candidate.name)}</td></tr>
              <tr><td style="color:var(--text-muted)">Email</td><td>${escapeHtml(exam.candidate.email)}</td></tr>
              <tr><td style="color:var(--text-muted)">Candidate ID</td><td>${escapeHtml(exam.candidate.id)}</td></tr>
              <tr><td style="color:var(--text-muted)">Start Time</td><td>${formatDate(exam.startTime)}</td></tr>
              <tr><td style="color:var(--text-muted)">Duration</td><td>${exam.duration}</td></tr>
              <tr><td style="color:var(--text-muted)">MCQ Score</td><td style="color:${scorePercent >= 70 ? "var(--success)" : "var(--danger)"}">${exam.mcqScore}/${exam.mcqTotal} (${scorePercent}%)</td></tr>
            </table>
          </div>

          ${exam.recordingFile ? `
          <div class="detail-section">
            <h3>📹 Proctoring Recording</h3>
            <video class="video-player" controls src="/api/recordings/${encodeURIComponent(exam.recordingFile)}"></video>
            <div style="margin-top:8px;">
              <button class="action-btn" onclick="downloadRecording('${escapeHtml(exam.recordingFile)}')">⬇️ Download Recording</button>
            </div>
          </div>` : ""}

          <div class="detail-section">
            <h3>⚠️ Proctoring Log (${exam.warnings ? exam.warnings.length : 0} warnings)</h3>
            ${warningLog}
          </div>

          <div class="detail-section">
            <h3>📝 Answers</h3>
            <table class="answer-table">
              <thead><tr><th>Question</th><th>Answer</th></tr></thead>
              <tbody>${answerRows}</tbody>
            </table>
          </div>
        `;

        document.getElementById("detail-modal").classList.add("active");
      }

      window.closeDetail = function () {
        document.getElementById("detail-modal").classList.remove("active");
      };

      // ── Watch Recording ──────────────────────────────
      window.watchRecording = function (filename) {
        const url = `/api/recordings/${encodeURIComponent(filename)}`;
        const win = window.open("", "_blank", "width=800,height=600");
        win.document.write(`<!DOCTYPE html><html><head><title>Recording Playback</title>
          <style>body{margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;}
          video{max-width:100%;max-height:100vh;}</style></head>
          <body><video src="${url}" controls autoplay style="width:100%;"></video></body></html>`);
      };

      // ── Download Recording ───────────────────────────
      window.downloadRecording = function (filename) {
        const url = `/api/recordings/${encodeURIComponent(filename)}/download`;
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      };

      // ── Delete Exam ──────────────────────────────────
      window.removeExam = async function (id) {
        if (!confirm("Delete this exam record and its recording? This cannot be undone.")) return;
        try {
          await fetch(`/api/exams/${encodeURIComponent(id)}`, { method: "DELETE" });
          loadDashboard();
        } catch (err) {
          alert("Failed to delete exam.");
        }
      };

      // Close modal on background click
      document.getElementById("detail-modal").addEventListener("click", (e) => {
        if (e.target === e.currentTarget) closeDetail();
      });

      // Auto-refresh every 30 seconds
      setInterval(loadDashboard, 30000);

      // Initialize
      loadDashboard();
    })();
  </script>
</body>
</html>
